_common: !include ../../package.common.yaml
<<: *common
<<: *flags

name: example-lib
version: 0.1.0.0

dependencies:
  - base

library:
  source-dirs: src

tests:
  test:
    source-dirs: test
    main: Spec.hs
    dependencies:
      - example-lib
      - hedgehog
      - tasty
      - tasty-hedgehog
      - tasty-hunit
    ghc-options: *test-ghc-options
    when:
      - condition: "!flag(in-nix-shell)"
        build-tools:
          - tasty-discover:tasty-discover
